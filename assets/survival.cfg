# ============================================================================
#  SURVIVAL MOD (protivnici u talasima)
# ============================================================================
#  Talas N racuna se ovako (pa se pomnozi sa mnoziocima tipa protivnika):
#    broj protivnika = broj_prvi + broj_rast * (N - 1)
#    zivot           = zivot_prvi * (1 + zivot_rast * (N - 1))
#    brzina          = brzina_prva + brzina_rast * (N - 1), ali najvise brzina_max
#  Pritisni R u igri da ponovo ucitas ovaj fajl (vazi od sledeceg talasa).
#  Za poredjenje: igrac ide 70 piksela u sekundi, a ima 100 zivota (10 srca).
# ============================================================================

atlas    ufeff_tiles_v2.png
velicina 16

# --- tipovi protivnika ---
# Sprite-ovi su "kolona red" u atlasu, za smer: dole, gore, desno, desno2, levo
#   desno2 = drugi frejm hoda udesno (ako nema, napisi isto kao desno)
#   levo -1 -1 = nema posebnog frejma, koristi se desno ogledalski okrenut
# zivot/brzina/steta = mnozioci (1 = obicno, 2 = duplo)
# od_talasa = od kog talasa moze da se pojavi
# tezina = koliko cesto se bira (vece = cesce)
#
#           ime     dole  gore  desno desno2 levo   zivot brzina steta od_talasa tezina
neprijatelj kostur  4 2   5 2   6 2   6 2    7 2    1.0   1.0    1.0   1         10
neprijatelj zombi   0 0   1 0   2 0   3 0    -1 -1  0.6   1.4    0.8   2         6
neprijatelj sluz    4 0   5 0   6 0   7 0    -1 -1  2.5   0.65   1.5   3         4

# --- talasi ---
broj_prvi          5      # koliko protivnika u 1. talasu
broj_rast          3      # koliko vise u svakom sledecem
zivot_prvi         30     # Glock (10 stete) ubija obicnog kostura za 3 metka
zivot_rast         0.20   # +20% zivota po talasu
brzina_prva        28     # piksela u sekundi
brzina_rast        2.5    # brzi za toliko svaki talas
brzina_max         62

# --- napad ---
steta              10     # koliko zivota skine jedan udarac (10 = jedno srce)
napad_pauza        0.8    # sekundi izmedju dva udarca istog protivnika

# --- pojavljivanje ---
razmak_pojave      1.2    # sekundi izmedju dva protivnika (1. talas; posle sve krace)
razmak_min         0.25
max_istovremeno    40     # vise od ovoga ne moze biti na mapi odjednom
pauza_talasa       12     # sekundi odmora izmedju talasa (tada je otvorena prodavnica)

# --- nagrade ---
novcici_min        1      # svaki ubijeni protivnik ispusti od novcici_min...
novcici_max        3      # ...do novcici_max novcica
pocetni_novac      150    # koliko novcica imas kad pocne survival (za prodavnicu)
sansa_oruzja       0.10   # 0.10 = 10% da ubijeni protivnik ispusti oruzje ili napitak
zivot_posle_talasa 20     # koliko zivota dobijes kad prezivis talas (20 = dva srca)
