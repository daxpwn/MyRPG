# ============================================================================
#  KONFIGURACIJA TILE-OVA
# ============================================================================
#  Atlas je jedna velika slika podeljena na polja (tile-ove) velicine 16x16.
#  Ovde svakom polju koje koristis das broj (id). Taj broj pises u map.txt.
#
#  id       - broj koji pises u mapu (assets/map.txt). Kreni od 0, bez rupa.
#  ime      - samo za tebe, da znas sta je sta (bez razmaka, koristi _)
#  kolona   - kolona u atlasu, 0 = skroz levo  (x u pikselima = kolona * 16)
#  red      - red u atlasu,    0 = skroz gore  (y u pikselima = red * 16)
#  solid    - 1 = igrac ne moze da prodje, 0 = moze
#  podloga  - id tile-a koji se crta ISPOD ovog. Treba za tile-ove sa
#             providnom pozadinom (drvo, cvece...). -1 = nista ispod.
#
#  Novi tile: otvori atlas, izbroj kolonu i red, dodaj red na dno tabele.
#  Kad igra radi, pritisni R da ponovo ucita ovaj fajl i mapu.
# ============================================================================

atlas    ufeff_tiles_v2.png
velicina 16

