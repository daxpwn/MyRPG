# ============================================================================
#  KONFIGURACIJA ORUZJA
# ============================================================================
#  Atlas: weapons.png, polja 16x16. Oruzje je nacrtano tako da gleda UDESNO.
#  Pritisni R u igri da ponovo ucitas ovaj fajl (zgodno za podesavanje).
#
#  id        - broj oruzja (koristi ga inventar)
#  ime       - prikazuje se u igri. Umesto razmaka pisi _  (Desert_Eagle -> "Desert Eagle")
#  kolona red- polje u atlasu
#  drska_x/y - piksel u sprite-u gde ga lik drzi. Oko te tacke se oruzje okrece.
#  cev_x/y   - piksel u sprite-u gde je kraj cevi. Odatle izlaze metak i plamen.
#  steta     - koliko stete pravi jedan metak (za kasnije, kad budu neprijatelji)
#  brzina    - koliko metaka u sekundi moze da ispali
#  metak     - brzina metka, piksela u sekundi (1 tile = 16 piksela)
#  rasipanje - za koliko stepeni metak moze da skrene levo/desno (preciznost)
#  komada    - koliko metaka izleti odjednom (sacmara > 1)
#  auto      - 1 = puca dok drzis taster, 0 = jedan klik = jedan metak
#  trzaj     - koliko piksela se oruzje trzne unazad + koliko se trese ekran
#  domet     - koliko piksela metak preleti pre nego sto nestane
#  tip       - puska   = puca metke (sve gore vazi)
#              noz     = zamah: rasipanje = pola luka zamaha (stepeni), domet = dohvat (px),
#                        brzina = zamaha u sekundi
#              granata = baca se: metak = najdalje bacanje (px), domet = poluprecnik
#                        eksplozije (px), brzina = bacanja u sekundi. Slaze se do 5 u jednom mestu.
#              lek     = napitak: steta = koliko zivota vraca (10 = jedno srce). Slaze se do 5.
#              pancir  = steta = koliko armora daje (od 10 mogucih)
#              kaciga  = steta = koliko armora daje
#              (lek, pancir i kaciga se koriste levim klikom kad su izabrani u hotbaru)
#
#  Opcione kolone posle tipa (samo za velike puske, ostale ih nemaju):
#  sirina visina - koliko polja atlasa zauzima slika (minigun: 6 x 2 = 96x32 piksela)
#  frejmova      - frejmovi animacije cevi, idu NADOLE u atlasu (svaki je `visina` polja nize)
#  zagrevanje    - sekundi drzanja klika dok se cevi ne zavrte; tek onda puca
#  skala         - koliko manje se crta (0.4 = 40%). Pikseli slike ostaju isti, samo su sitniji.
#                  drska_x/y i cev_x/y se i dalje pisu u pikselima VELIKE slike.
# ============================================================================

atlas    weapons.png
velicina 16

# plamen iz cevi: kolona red brojFrejmova  (frejmovi idu udesno u atlasu)
plamen   0 2 3

